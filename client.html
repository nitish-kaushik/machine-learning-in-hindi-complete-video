<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Model Chat</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #07111f;
			--panel: rgba(10, 18, 33, 0.72);
			--panel-strong: rgba(12, 22, 40, 0.9);
			--primary: #7c9cff;
			--primary-dark: #5f83ff;
			--text: #eef4ff;
			--muted: #99a8c7;
			--border: rgba(148, 163, 184, 0.18);
			--bot: rgba(255, 255, 255, 0.06);
			--user: linear-gradient(135deg, #4f7cff 0%, #8b5cf6 100%);
			--shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Inter, Arial, Helvetica, sans-serif;
			background:
				radial-gradient(circle at top left, rgba(76, 110, 245, 0.35), transparent 28%),
				radial-gradient(circle at top right, rgba(139, 92, 246, 0.28), transparent 24%),
				radial-gradient(circle at bottom center, rgba(14, 165, 233, 0.18), transparent 30%),
				linear-gradient(180deg, #08101d 0%, var(--bg) 100%);
			color: var(--text);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			position: relative;
			overflow: hidden;
		}

		body::before,
		body::after {
			content: '';
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		body::before {
			background-image:
				linear-gradient(rgba(124, 156, 255, 0.07) 1px, transparent 1px),
				linear-gradient(90deg, rgba(124, 156, 255, 0.07) 1px, transparent 1px);
			background-size: 40px 40px;
			mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
		}

		body::after {
			background:
				radial-gradient(circle at 15% 20%, rgba(59, 130, 246, 0.18), transparent 10%),
				radial-gradient(circle at 82% 24%, rgba(168, 85, 247, 0.18), transparent 12%),
				radial-gradient(circle at 50% 82%, rgba(6, 182, 212, 0.12), transparent 10%);
		}

		.chat-app {
			width: min(100%, 860px);
			height: min(90vh, 820px);
			min-height: 620px;
			background: var(--panel);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid var(--border);
			border-radius: 28px;
			box-shadow: var(--shadow);
			display: flex;
			flex-direction: column;
			overflow: hidden;
			position: relative;
		}

		.chat-app::before {
			content: '';
			position: absolute;
			inset: 0;
			background:
				radial-gradient(circle at top, rgba(124, 156, 255, 0.16), transparent 24%),
				linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 30%);
			pointer-events: none;
		}

		.status {
			margin: 0;
			color: var(--muted);
			line-height: 1.5;
			font-size: 0.92rem;
		}

		.composer textarea:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 4px rgba(124, 156, 255, 0.14);
		}

		.chat-panel {
			display: flex;
			flex-direction: column;
			flex: 1;
			height: 100%;
			min-height: 0;
			position: relative;
			z-index: 1;
		}

		.chat-header {
			padding: 24px 28px 18px;
			border-bottom: 1px solid var(--border);
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 8px;
			background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
		}

		.title-chip {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 7px 12px;
			border-radius: 999px;
			background: rgba(124, 156, 255, 0.1);
			border: 1px solid rgba(124, 156, 255, 0.18);
			color: #bfd0ff;
			font-size: 0.78rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
		}

		.title-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: linear-gradient(135deg, #7c9cff 0%, #8b5cf6 100%);
			box-shadow: 0 0 12px rgba(124, 156, 255, 0.7);
		}

		.chat-header h2 {
			margin: 0;
			font-size: clamp(1.6rem, 3vw, 2.35rem);
			line-height: 1.1;
			font-weight: 700;
			max-width: 700px;
			letter-spacing: -0.03em;
		}

		.title-gradient {
			display: block;
			background: linear-gradient(135deg, #f8fbff 0%, #8eb2ff 45%, #b794ff 100%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.title-subtext {
			max-width: 620px;
			margin: 0;
			font-size: 0.98rem;
			line-height: 1.6;
			color: #a8b7d6;
		}

		.chat-header p {
			color: var(--muted);
			font-size: 0.92rem;
			margin: 0;
		}

		.messages {
			flex: 1;
			height: 100%;
			min-height: 0;
			overflow-y: auto;
			overflow-x: hidden;
			padding: 28px 24px 18px 28px;
			display: flex;
			flex-direction: column;
			gap: 18px;
			background: linear-gradient(180deg, rgba(7, 17, 31, 0.08), rgba(7, 17, 31, 0.02));
			scrollbar-width: none;
		}

		.messages::before {
			content: '';
			flex: 1 0 24px;
		}

		.messages::-webkit-scrollbar {
			width: 0;
			height: 0;
		}

		.messages::-webkit-scrollbar-track {
			background: transparent;
		}

		.messages::-webkit-scrollbar-thumb {
			background: linear-gradient(180deg, rgba(124, 156, 255, 0.75), rgba(139, 92, 246, 0.75));
			border-radius: 999px;
			border: 2px solid transparent;
			background-clip: padding-box;
		}

		.messages-shell {
			position: relative;
			flex: 1;
			min-height: 0;
			overflow: hidden;
		}

		.scroll-rail {
			position: absolute;
			top: 16px;
			right: 10px;
			bottom: 16px;
			width: 8px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.07);
			border: 1px solid rgba(255, 255, 255, 0.05);
			overflow: hidden;
			pointer-events: none;
		}

		.scroll-thumb {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 0;
			border-radius: 999px;
			background: linear-gradient(180deg, rgba(124, 156, 255, 0.95), rgba(139, 92, 246, 0.95));
			box-shadow: 0 0 14px rgba(124, 156, 255, 0.35);
			opacity: 0;
			transition: opacity 0.2s ease;
		}

		.scroll-rail.visible .scroll-thumb {
			opacity: 1;
		}

		.message-row {
			display: flex;
			animation: fadeUp 0.24s ease;
		}

		.message-row.user {
			justify-content: flex-end;
		}

		.message-row.bot {
			justify-content: flex-start;
		}

		.bubble {
			max-width: min(80%, 640px);
			padding: 14px 18px;
			border-radius: 18px;
			line-height: 1.5;
			white-space: pre-wrap;
			word-break: break-word;
			border: 1px solid var(--border);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
		}

		.message-row.user .bubble {
			background: var(--user);
			color: #ffffff;
			border: none;
			border-bottom-right-radius: 8px;
		}

		.message-row.bot .bubble {
			background: var(--bot);
			color: var(--text);
			border-bottom-left-radius: 8px;
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
		}

		.bubble small {
			display: block;
			margin-bottom: 6px;
			opacity: 0.85;
			font-size: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}

		.composer {
			flex-shrink: 0;
			padding: 18px 22px 22px;
			background: linear-gradient(180deg, transparent, rgba(6, 12, 24, 0.34));
		}

		.composer-shell {
			display: flex;
			align-items: flex-end;
			gap: 14px;
			padding: 14px;
			background: var(--panel-strong);
			border: 1px solid var(--border);
			border-radius: 22px;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
		}

		.composer textarea {
			flex: 1;
			min-height: 56px;
			max-height: 180px;
			resize: vertical;
			border: 1px solid transparent;
			border-radius: 16px;
			padding: 16px 18px;
			font-size: 1rem;
			font-family: inherit;
			outline: none;
			color: var(--text);
			background: rgba(255, 255, 255, 0.04);
			transition: border-color 0.2s ease, box-shadow 0.2s ease;
		}

		.composer textarea::placeholder {
			color: #7e8ca8;
		}

		.composer-actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 12px;
		}

		button {
			border: none;
			border-radius: 16px;
			background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
			color: #ffffff;
			padding: 16px 22px;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 12px 24px rgba(95, 131, 255, 0.28);
			transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
		}

		button:hover {
			transform: translateY(-1px);
			box-shadow: 0 14px 28px rgba(95, 131, 255, 0.34);
		}

		button:disabled {
			opacity: 0.65;
			cursor: not-allowed;
			transform: none;
		}

		.status {
			min-height: 22px;
		}

		@keyframes fadeUp {
			from {
				opacity: 0;
				transform: translateY(8px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		@media (max-width: 860px) {
			.chat-app {
				height: calc(100vh - 24px);
				min-height: 0;
				border-radius: 22px;
			}

			.messages {
				min-height: 0;
			}

			.bubble {
				max-width: 90%;
			}

			.composer-shell {
				flex-direction: column;
				align-items: stretch;
			}

			button {
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<main class="chat-app">
		<section class="chat-panel">
			<header class="chat-header">
				<div class="title-chip">
					<span class="title-dot"></span>
					AI News Intelligence
				</div>
				<h2>
					<span class="title-gradient">AI Powered news category.</span>
				</h2>
				<p id="status" class="status"></p>
			</header>

			<div class="messages-shell">
				<div id="messages" class="messages"></div>
				<div id="scrollRail" class="scroll-rail" aria-hidden="true">
					<div id="scrollThumb" class="scroll-thumb"></div>
				</div>
			</div>

			<footer class="composer">
				<div class="composer-shell">
					<textarea id="questionInput" placeholder="Message the model..." rows="1"></textarea>
					<div class="composer-actions">
						<button id="sendButton" type="button">Send</button>
					</div>
				</div>
			</footer>
		</section>
	</main>

	<script>
		const apiUrl = 'http://localhost:5299/ask';
		const questionInput = document.getElementById('questionInput');
		const sendButton = document.getElementById('sendButton');
		const messages = document.getElementById('messages');
		const status = document.getElementById('status');
		const scrollRail = document.getElementById('scrollRail');
		const scrollThumb = document.getElementById('scrollThumb');

		function autoResize() {
			questionInput.style.height = '56px';
			questionInput.style.height = `${Math.min(questionInput.scrollHeight, 180)}px`;
		}

		function updateScrollThumb() {
			const { scrollTop, scrollHeight, clientHeight } = messages;

			if (scrollHeight <= clientHeight) {
				scrollRail.classList.remove('visible');
				scrollThumb.style.height = '0';
				return;
			}

			const railHeight = scrollRail.clientHeight;
			const thumbHeight = Math.max((clientHeight / scrollHeight) * railHeight, 48);
			const maxTop = railHeight - thumbHeight;
			const thumbTop = maxTop * (scrollTop / (scrollHeight - clientHeight));

			scrollRail.classList.add('visible');
			scrollThumb.style.height = `${thumbHeight}px`;
			scrollThumb.style.transform = `translateY(${thumbTop}px)`;
		}

		function appendMessage(role, text) {
			const row = document.createElement('div');
			row.className = `message-row ${role}`;

			const bubble = document.createElement('div');
			bubble.className = 'bubble';

			const label = document.createElement('small');
			label.textContent = role === 'user' ? 'You' : 'Assistant';

			const content = document.createElement('div');
			content.textContent = text;

			bubble.appendChild(label);
			bubble.appendChild(content);
			row.appendChild(bubble);
			messages.appendChild(row);
			messages.scrollTop = messages.scrollHeight;
			updateScrollThumb();
		}

		function setBusy(isBusy, message) {
			sendButton.disabled = isBusy;
			questionInput.disabled = isBusy;
			status.textContent = message;
		}

		function formatResponse(data) {
			if (typeof data === 'string') {
				return data;
			}

			if (data?.predictedLabel) {
				return data.predictedLabel;
			}

			if (data?.answer) {
				return data.answer;
			}

			if (data?.response) {
				return data.response;
			}

			return JSON.stringify(data, null, 2);
		}

		async function sendMessage() {
			const question = questionInput.value.trim();

			if (!question) {
				status.textContent = 'Please enter a question first.';
				questionInput.focus();
				return;
			}

			appendMessage('user', question);
			questionInput.value = '';
			autoResize();
			setBusy(true, 'Waiting for API response...');

			try {
				const response = await fetch(apiUrl, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						title: question,
						content: question
					})
				});

				if (!response.ok) {
					throw new Error(`Request failed with status ${response.status}`);
				}

				const data = await response.json();
				appendMessage('bot', formatResponse(data));
				setBusy(false, 'Response received.');
				questionInput.focus();
			} catch (error) {
				appendMessage('bot', `Error: ${error.message}`);
				setBusy(false, 'Request failed. Check the API URL and backend.');
				questionInput.focus();
			}
		}

		sendButton.addEventListener('click', sendMessage);

		status.textContent = 'Ready.';
		autoResize();
		updateScrollThumb();

		questionInput.addEventListener('input', autoResize);
		messages.addEventListener('scroll', updateScrollThumb);
		window.addEventListener('resize', updateScrollThumb);

		questionInput.addEventListener('keydown', (event) => {
			if (event.key === 'Enter' && !event.shiftKey) {
				event.preventDefault();
				if (!sendButton.disabled) {
					sendMessage();
				}
			}
		});
	</script>
</body>
</html>
